[workspace]
members = ["crates/fussycat-core", "crates/fussycat-providers", "crates/fussycat"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# rig-core 0.45 needs 1.97.1; keep this in step with it.
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
