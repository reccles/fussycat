# The gates on every PR and every push to main. No release here: publishing
# is release.yml's, on a version tag.
#
# Toolchains are pinned: a new Rust (and its lints) arrives by PR, not by
# surprise. RUST is the toolchain the gates run on; MSRV is Cargo.toml's
# rust-version. So is the Linux image (ubuntu-26.04, not ubuntu-latest), for
# the same reason.
# Third-party actions are pinned to commit SHAs (bump the SHA and the comment).
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A PR push cancels the PR's older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST: 1.99.1
  MSRV: 1.97.1
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # S1-S10; S11 needs a list of private names, which a fork keeps itself.
      - name: architecture evals
        run: |
          command -v rg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; }
          scripts/arch-eval.sh

  # macOS too: it's the main dev platform and a release target, its dependency
  # tree differs (Security and SystemConfiguration frameworks), and its sh,
  # kill and signals are what the process-group and signal tests exercise.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        run: cargo test --locked --workspace

  # rust-version is a claim that it compiles, so check (with the tests) is
  # enough; behaviour is the test job's.
  msrv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: check
        run: cargo check --locked --workspace --all-targets

  # The examples need a live model, so running them stays a local check; this
  # only lints them. examples/.shellcheckrc applies, and -x follows `. lib.sh`.
  # Pinned and checksum-verified: bump the version AND the sha together.
  shellcheck:
    runs-on: ubuntu-26.04
    env:
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install shellcheck
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c --quiet -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: lint
        run: shellcheck -x examples/*.sh examples/tools/pigglywiggly

  # The binary, not gitleaks-action (which needs a licence for orgs). Pinned
  # and checksum-verified: bump the version AND the sha together.
  gitleaks:
    runs-on: ubuntu-26.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a secret stays in it once committed
          persist-credentials: false
      - name: install gitleaks
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --redact keeps a found secret out of the log, the last place to print it.
      - name: scan
        run: gitleaks git --redact --no-banner --exit-code 1 .
