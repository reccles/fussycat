# The gates on every PR and every push to main. No release here: publishing
# is a later, separate workflow.
#
# Toolchains are pinned: a new Rust (and its lints) arrives by PR, not by
# surprise. RUST is the toolchain the gates run on; MSRV is Cargo.toml's
# rust-version.
# Third-party actions are pinned to commit SHAs (bump the SHA and the comment).
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A PR push cancels the PR's older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST: 1.99.1
  MSRV: 1.97.1
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # macOS too: it's the main dev platform and a release target, its dependency
  # tree differs (Security and SystemConfiguration frameworks), and its sh,
  # kill and signals are what the process-group and signal tests exercise.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        run: cargo test --locked --workspace

  # rust-version is a claim that it compiles, so check (with the tests) is
  # enough; behaviour is the test job's.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: check
        run: cargo check --locked --workspace --all-targets

  # The binary, not gitleaks-action (which needs a licence for orgs). Pinned
  # and checksum-verified: bump the version AND the sha together.
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a secret stays in it once committed
          persist-credentials: false
      - name: install gitleaks
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --redact keeps a found secret out of the log, the last place to print it.
      - name: scan
        run: gitleaks git --redact --no-banner --exit-code 1 .
