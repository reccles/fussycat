[package]
name = "fussycat-providers"
description = "fussycat's provider adapters: the core's Provider port over rig-core. No CLI, no printing, no processes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fussycat-core = { path = "../fussycat-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["time"] }
# LLM library: pinned, upgraded deliberately, and used only in this crate
# (architecture eval S8).
rig-core = "=0.45.0"
rig-reqwest = "=0.45.0"
reqwest = { version = "0.13", default-features = false }

[dev-dependencies]
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }

[lints]
workspace = true
