[package]
name = "fussycat"
description = "A unix-philosophy agent CLI built on the Agent Quilt pattern."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fussycat-core = { path = "../fussycat-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "signal", "time"] }
# LLM library: pinned, upgraded deliberately, and used only in providers/
# (architecture eval S8).
rig-core = "=0.45.0"
rig-reqwest = "=0.45.0"
reqwest = { version = "0.13", default-features = false }
toml = "1.1.8"
regex = "1.13.1"

[lints]
workspace = true
